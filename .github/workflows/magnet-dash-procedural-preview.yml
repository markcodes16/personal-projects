name: Validate Magnet Dash procedural preview

on:
  push:
    branches:
      - feature/procedural-obstacle-courses
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: magnet-dash-procedural-preview
  cancel-in-progress: false

jobs:
  validate-and-publish-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: magnet-dash
    steps:
      - name: Check out the procedural branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: magnet-dash/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run unit and procedural tests
        run: npm test
      - name: Check production TypeScript build
        run: npm run build
      - name: Install Chromium and system libraries for browser tests
        run: npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser tests
        run: npm run test:browser
      - name: Run seeded pilot simulations
        run: node --experimental-strip-types scripts/review.ts
      - name: Publish standalone preview on this feature branch only
        run: npm run refresh:demo
      - name: Commit verified demo and diagnostics on feature branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add demo/index.html docs/PLAYTEST_V5_1.json
          if ! git diff --cached --quiet; then
            git commit -m "Build and validate procedural obstacle preview"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Upload preview and diagnostic artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: magnet-dash-procedural-preview
          path: |
            magnet-dash/demo/index.html
            magnet-dash/docs/PLAYTEST_V5_1.json
          retention-days: 30
