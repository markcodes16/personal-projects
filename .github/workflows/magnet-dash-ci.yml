name: Verify Magnet Dash

on:
  push:
    branches: [main]
    paths:
      - 'magnet-dash/**'
      - '.github/workflows/magnet-dash-ci.yml'
  pull_request:
    paths:
      - 'magnet-dash/**'
      - '.github/workflows/magnet-dash-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: magnet-dash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: magnet-dash/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
